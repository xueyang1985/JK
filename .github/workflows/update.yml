name: update-tvbox-config

on:
  schedule:
    # 每天 UTC 21:00（北京时间早上 05:00）自动构建
    - cron: '0 21 * * *'
  workflow_dispatch: {}      # 也可以在网页上手点一次

permissions:
  contents: write

concurrency:
  group: update-tvbox-config
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取上游 + 合并去重 + 站点探活
        run: python scripts/build.py

      - name: 提交新配置（无变化则跳过）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox.json meta.json
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新接口 $(date -u +%Y-%m-%d)"
          git push
